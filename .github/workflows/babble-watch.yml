name: Babble Steam Frame watch

on:
  schedule:
    # Starts every 30 minutes (times are UTC). The script then waits a random
    # 0-25 minutes, so each check lands at a random moment in its half hour.
    - cron: "11,41 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a TEST alarm to your phone, PC and Gmail"
        type: boolean
        default: false

permissions:
  contents: write   # lets the job save state.json (what the shop looked like last time)

concurrency:
  group: babble-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check the Babble shop
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          EVENT: ${{ github.event_name }}
          TEST_ALERT: ${{ inputs.test_alert }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$TEST_ALERT" = "true" ]; then
            python3 check.py --test
          elif [ "$EVENT" = "schedule" ]; then
            python3 check.py --max-delay 1500
          else
            python3 check.py
          fi

      - name: Save what the shop looks like now
        run: |
          git add state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing new to save."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update shop snapshot"
          git pull --rebase
          git push
